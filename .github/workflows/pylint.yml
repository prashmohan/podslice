name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint pylint-django
    - name: Analysing the code with pylint
      env:
        DJANGO_SECRET_KEY: 'a-dummy-secret-key-for-testing'
        GEMINI_API_KEY: 'a-dummy-gemini-key-for-testing'
        GEMINI_MODEL: 'gemini-3.8-flash'
        REHOST_BASE_URL: 'http://localhost:8000'
      run: |
        pylint --load-plugins pylint_django --django-settings-module=podslice.settings podcasts
      continue-on-error: true
