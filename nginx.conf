upstream podslice {
    server app:8000;
}

server {
    listen 12343;

    location / {
        proxy_pass http://podslice;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location ~ ^/media/episodes/(.*)$ {
        alias /app/media/$1.mp3;
    }
}
