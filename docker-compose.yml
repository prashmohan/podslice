services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    command: gunicorn --bind 0.0.0.0:8000 podslice.wsgi:application

  web:
    image: nginx:latest
    ports:
      - "12343:12343"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - app

volumes:
  static_volume:
  media_volume: