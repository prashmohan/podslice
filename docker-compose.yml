services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - db_volume:/app/db
    command: gunicorn --bind 0.0.0.0:8000 podslice.wsgi:application
    restart: unless-stopped  # Common choice for production-like services


  web:
    image: nginx:latest
    ports:
      - "12343:12343"
      - "12341:12341"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - app
    restart: unless-stopped  # Common choice for production-like services
          

volumes:
  static_volume:
  media_volume:
  db_volume:
